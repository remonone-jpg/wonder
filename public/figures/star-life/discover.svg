<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 224" width="660" height="439" role="img">
  <rect width="340" height="224" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">빛 하나로 알아낸 것들</text>

  <line x1="40" y1="46" x2="40" y2="192" stroke="#4a5a78" stroke-width="1"/>

  <circle cx="40" cy="56" r="5" fill="#ffd54a"/>
  <text x="58" y="52" font-family="system-ui, sans-serif" font-size="13" fill="#cfd8e8">밝기로 등급을 나누다</text>
  <text x="58" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">히파르코스 · 기원전 2세기</text>

  <circle cx="40" cy="98" r="5" fill="#ffd54a"/>
  <text x="58" y="94" font-family="system-ui, sans-serif" font-size="13" fill="#cfd8e8">별까지의 거리를 처음 재다</text>
  <text x="58" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">베셀 · 1838년</text>

  <circle cx="40" cy="140" r="5" fill="#ffd54a"/>
  <text x="58" y="136" font-family="system-ui, sans-serif" font-size="13" fill="#cfd8e8">별이 대부분 수소임을 밝히다</text>
  <text x="58" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">페인 · 1925년</text>

  <circle cx="40" cy="182" r="5" fill="#ffd54a"/>
  <text x="58" y="178" font-family="system-ui, sans-serif" font-size="13" fill="#cfd8e8">18억 개의 자리와 거리를 재다</text>
  <text x="58" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">가이아 위성 · 2013년부터</text>

  <text x="170" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">차례만 적은 것이라 해의 간격은 실제 비율이 아닙니다</text>
</svg>
