<text x="170.0" y="168" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="9" font-weight="400">지구 반지름의 몇 배</text>
<circle cx="50.0" cy="98" r="2.2" fill="#9ad0ff"/>
<circle cx="119.1" cy="98" r="8.5" fill="#7fd8c0"/>
<circle cx="295.0" cy="98" r="24.7" fill="#ffc98a"/>
