<text x="72.19999999999999" y="38" text-anchor="start" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="8" font-weight="400">1.8배가 가장 드묾</text>
<text x="170" y="182" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">색칠한 띠가 외계행성에서 가장 흔한 크기인데</text>
