<line x1="218.0" y1="138" x2="218.0" y2="143" stroke="#4d6ea8" stroke-width="1"/>
<text x="218.0" y="154" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">8</text>
