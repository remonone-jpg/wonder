<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 206" width="660" role="img" aria-label="가로축이 지구 반지름의 몇 배인지를 나타내는 눈금이고, 그 위에 크기가 다른 동그라미 셋이 놓인 그림.">
<rect width="340" height="206" fill="#0b1220"/>
