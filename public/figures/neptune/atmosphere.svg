  <rect width="340" height="230" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">안개 두께가 색을 정합니다</text>

  <text x="100" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8f4f8">두꺼운 안개</text>
  <rect x="54" y="84" width="92" height="22" fill="#e8f4f8" opacity="0.85"/>
  <circle cx="100" cy="146" r="40" fill="#a8d8e8"/>
  <text x="100" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a8d8e8">천왕성</text>

  <text x="240" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e8f4f8">얇은 안개</text>
  <rect x="194" y="96" width="92" height="10" fill="#e8f4f8" opacity="0.85"/>
