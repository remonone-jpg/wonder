<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="660" height="408" role="img">
  <rect width="340" height="210" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cfd8e8">연필이 망원경보다 먼저 찾았습니다</text>

  <rect x="24" y="42" width="196" height="118" rx="6" fill="#10152a" stroke="#2a3350" stroke-width="1.2"/>
  <g fill="#8fa6c8">
    <circle cx="48" cy="66" r="1.4"/><circle cx="86" cy="54" r="1"/><circle cx="130" cy="72" r="1.6"/>
    <circle cx="176" cy="58" r="1.2"/><circle cx="200" cy="84" r="1"/><circle cx="60" cy="104" r="1.2"/>
    <circle cx="94" cy="132" r="1.4"/><circle cx="152" cy="126" r="1"/><circle cx="192" cy="140" r="1.4"/>
    <circle cx="40" cy="146" r="1"/><circle cx="166" cy="98" r="1.2"/><circle cx="72" cy="86" r="1"/>
  </g>
  <circle cx="118" cy="104" r="18" fill="none" stroke="#efd9a6" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="126" cy="100" r="4" fill="#4f9fd8"/>

  <line x1="140" y1="96" x2="232" y2="78" stroke="#5b6a8a" stroke-width="1"/>
  <text x="238" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#9dbbe4">찾아낸 자리</text>
  <line x1="118" y1="124" x2="232" y2="136" stroke="#5b6a8a" stroke-width="1"/>
  <text x="238" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#efd9a6">계산한 자리</text>

  <text x="170" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cfd8e8">1846년 9월 23일 밤, 편지를 받은 그날 찾았습니다</text>
  <text x="170" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">계산한 자리에서 1도도 떨어지지 않았어요</text>
