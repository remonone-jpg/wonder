  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cfd8e8">가는 데만 열두 해가 넘습니다</text>

  <circle cx="30" cy="112" r="7" fill="#6b93d6"/>
