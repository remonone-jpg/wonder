  </defs>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cfd8e8">카이퍼 벨트를 만든 행성</text>

  <circle cx="24" cy="100" r="6" fill="#ffb84d"/>
  <text x="24" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffe3a8">태양</text>

  <circle cx="110" cy="100" r="10" fill="#4f7fe0" opacity="0.35"/>
  <line x1="126" y1="100" x2="212" y2="100" stroke="#7fa8e8" stroke-width="2.4" marker-end="url(#nm)"/>
  <circle cx="236" cy="100" r="10" fill="#4f7fe0"/>

  <g fill="#8fa6c8">
    <circle cx="258" cy="84" r="2"/><circle cx="268" cy="98" r="2"/><circle cx="264" cy="114" r="2"/>
    <circle cx="278" cy="88" r="2"/><circle cx="282" cy="106" r="2"/><circle cx="290" cy="94" r="2"/>
    <circle cx="296" cy="112" r="2"/><circle cx="304" cy="86" r="2"/><circle cx="310" cy="102" r="2"/>
    <circle cx="272" cy="76" r="2"/><circle cx="300" cy="74" r="2"/><circle cx="288" cy="120" r="2"/>
    <circle cx="316" cy="116" r="2"/><circle cx="252" cy="104" r="2"/>
