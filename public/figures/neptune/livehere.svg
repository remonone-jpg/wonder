  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">대답이 여덟 시간 뒤에 옵니다</text>

  <circle cx="50" cy="104" r="18" fill="#6b93d6"/>
  <circle cx="290" cy="104" r="20" fill="#4f7fe0"/>

