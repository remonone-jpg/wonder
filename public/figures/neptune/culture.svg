<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="660" height="427" role="img">
  <rect width="340" height="220" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cfd8e8">두 사람이 따로 같은 답을 냈습니다</text>

  <text x="86" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#9dbbe4">아담스 · 영국</text>
  <text x="86" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">1845년 가을에 답을 냄</text>
  <text x="86" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">제대로 다뤄지지 않음</text>
  <line x1="86" y1="102" x2="86" y2="122" stroke="#5b6a8a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g stroke="#e2725b" stroke-width="2.4" stroke-linecap="round">
    <line x1="79" y1="125" x2="93" y2="139"/>
    <line x1="93" y1="125" x2="79" y2="139"/>
  </g>

  <text x="254" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">르베리에 · 프랑스</text>
  <text x="254" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">1846년 여름에 답을 냄</text>
  <text x="254" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">갈레에게 편지를 보냄</text>
  <path d="M254,102 L254,126 L186,126 L186,140" fill="none" stroke="#efd9a6" stroke-width="1.6"/>

  <text x="170" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">1846년 9월 23일 · 갈레가 발견</text>

  <text x="170" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cfd8e8">먼저 푼 것과, 남이 확인할 수 있게 내놓은 것</text>
  <text x="170" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cfd8e8">무엇이 발견일까요</text>
</svg>
