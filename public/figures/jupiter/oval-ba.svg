<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" width="660" role="img" aria-label="가로로 긴 띠 안에 네 무리가 놓여 있다. 왼쪽에는 흰 타원 셋이 세로로 있고, 오른쪽으로 갈수록 하나로 합쳐지며 색이 붉어졌다가 다시 옅어진다. 각 무리 아래에 연도가 적혀 있다.">
<rect width="340" height="198" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">셋이 하나가 되었다가 다시 옅어졌다</text>
<text x="170" y="40" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="9" font-weight="400">목성 남반구의 같은 띠에서</text>
<rect x="20" y="52" width="300" height="52" fill="#2a3448"/>
<rect x="20" y="52" width="300" height="52" fill="none" stroke="#4d6ea8" stroke-width="0.6"/>
<ellipse cx="52" cy="61" rx="9" ry="5.5" fill="#f2f4f7" stroke="#9fb8d8" stroke-width="0.5"/>
<ellipse cx="52" cy="78" rx="9" ry="5.5" fill="#f2f4f7" stroke="#9fb8d8" stroke-width="0.5"/>
<ellipse cx="52" cy="95" rx="9" ry="5.5" fill="#f2f4f7" stroke="#9fb8d8" stroke-width="0.5"/>
<text x="52" y="122" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">1998년</text>
<text x="52" y="135" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">흰 폭풍 셋</text>
<ellipse cx="128" cy="78" rx="17" ry="10" fill="#eceff3" stroke="#9fb8d8" stroke-width="0.6"/>
<text x="128" y="122" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">2000년</text>
<text x="128" y="135" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">하나로 합쳐짐</text>
<ellipse cx="206" cy="78" rx="17" ry="10" fill="#c96a44" stroke="#9fb8d8" stroke-width="0.6"/>
<text x="206" y="122" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">2006년</text>
<text x="206" y="135" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">붉게 물듦</text>
<ellipse cx="288" cy="78" rx="17" ry="10" fill="#ddd6cd" stroke="#9fb8d8" stroke-width="0.6"/>
<text x="288" y="122" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">2026년</text>
<text x="288" y="135" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">다시 옅어짐</text>
<defs><marker id="ar3" viewBox="0 0 6 6" refX="4" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9fb8d8"/></marker></defs>
<path d="M 70 78 L 104 78" stroke="#9fb8d8" stroke-width="1.1" marker-end="url(#ar3)"/>
<path d="M 152 78 L 182 78" stroke="#9fb8d8" stroke-width="1.1" marker-end="url(#ar3)"/>
<path d="M 231 78 L 264 78" stroke="#9fb8d8" stroke-width="1.1" marker-end="url(#ar3)"/>
<text x="170" y="160" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">대적점이 아니라 그 아래 띠에서 벌어진 일이에요</text>
<text x="170" y="174" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">왜 붉어졌다가 왜 다시 옅어졌는지는 아직 설명하지 못합니다</text>
<text x="170" y="188" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">타원의 크기와 색은 사진의 느낌을 옮긴 것이고 실제 비율이 아닙니다</text>
</svg>
