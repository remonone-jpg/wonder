  <text x="170" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">지구를 1밀리미터 구슬로 줄이면</text>
  <text x="170" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">태양은 자몽이 되어 12미터, 목성은 61미터 떨어집니다</text>
