  <rect width="340" height="208" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">빛도 43분이 걸립니다</text>

  <line x1="30" y1="92" x2="310" y2="92" stroke="#4a5a78" stroke-width="2"/>

  <circle cx="30" cy="92" r="10" fill="#ffd54a"/>
  <circle cx="84" cy="92" r="4" fill="#6b93d6"/>
  <circle cx="310" cy="92" r="8" fill="#d4ae88"/>

  <text x="30" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffd54a">태양</text>
  <text x="84" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b93d6">지구</text>
  <text x="84" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">8분 20초</text>
