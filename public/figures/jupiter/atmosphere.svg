<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 216" width="660" height="422" role="img">
  <rect width="340" height="216" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">높이마다 다른 것이 얼어붙습니다</text>

  <text x="30" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">위</text>
  <text x="26" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">아래</text>
  <line x1="36" y1="78" x2="36" y2="136" stroke="#8fa6c8" stroke-width="1"/>

  <rect x="56" y="54" width="248" height="28" fill="#f0ece4"/>
  <text x="180" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1f2e">암모니아 구름</text>

  <rect x="56" y="92" width="248" height="28" fill="#c79c5e"/>
  <text x="180" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1f2e">황화수소암모늄 구름</text>

  <rect x="56" y="130" width="248" height="28" fill="#8fa6c8"/>
  <text x="180" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1a1f2e">물 구름</text>

  <text x="170" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f0ece4">맨 위 암모니아 구름이 흰 띠로 보입니다</text>
  <text x="170" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">그 구름이 걷혀 아래가 드러난 자리가 어두운 띠예요</text>
</svg>
