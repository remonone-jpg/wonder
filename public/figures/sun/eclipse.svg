<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 224" width="660" role="img" aria-label="가운데 지구를 두고 달의 길을 나타낸 타원이 비스듬히 기울어 있고, 두 길이 만나는 두 점이 표시돼 있다.">
<rect width="340" height="224" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">달의 길이 기울어 있어서</text>
<path d="M 12 102 L 328 102" stroke="#4d6ea8" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="328" y="95" text-anchor="end" fill="#9fb0c8" font-family="system-ui, sans-serif" font-size="9" font-weight="400">지구가 도는 길</text>
<g transform="rotate(-10 170 102)">
<ellipse cx="170" cy="102" rx="104" ry="24" fill="none" stroke="#e0b070" stroke-width="1.3"/>
</g>
<text x="170" y="52" text-anchor="middle" fill="#e0b070" font-family="system-ui, sans-serif" font-size="9" font-weight="400">달이 도는 길</text>
<circle cx="170" cy="102" r="8" fill="#4a8fd4"/>
<circle cx="67.6" cy="120.1" r="4.5" fill="#fff3dd" stroke="#ffd27f" stroke-width="1.4"/>
<circle cx="272.4" cy="83.9" r="4.5" fill="#fff3dd" stroke="#ffd27f" stroke-width="1.4"/>
<text x="170" y="158" text-anchor="middle" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="400">두 길이 만나는 점 둘</text>
<text x="170" y="186" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">두 길이 만나는 두 점에서 그믐이 겹칠 때만 일식이 생깁니다</text>
<text x="170" y="200" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">다른 때는 달이 해의 위나 아래로 비껴 지나가요</text>
<text x="170" y="214" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">두 길이 벌어진 각은 5도입니다</text>
</svg>
