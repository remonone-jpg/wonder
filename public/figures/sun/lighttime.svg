<text x="56" y="128" text-anchor="end" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="8" font-weight="400">토성</text>
<text x="141.8592" y="128" text-anchor="start" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">1시간 19분</text>
