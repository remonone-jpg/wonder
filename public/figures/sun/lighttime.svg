<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" width="660" role="img" aria-label="왼쪽 해에서 오른쪽으로 길이가 다른 막대 여덟 개가 나란히 뻗어 있다. 위의 넷은 아주 짧고 아래로 갈수록 훨씬 길다.">
<rect width="340" height="214" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">빛이 닿는 데 걸리는 시간</text>
<rect x="62" y="40" width="3.0" height="9" rx="2" fill="#9ad0ff"/>
<text x="56" y="48" text-anchor="end" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="8" font-weight="400">수성</text>
