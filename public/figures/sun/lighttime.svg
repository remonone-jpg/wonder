<text x="170" y="176" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">안쪽 넷은 한 시간 안에 다 들어가는데</text>
<text x="170" y="190" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">바깥으로는 한 걸음마다 시간이 훌쩍 뜁니다</text>
<text x="170" y="204" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">태양계가 바깥으로 갈수록 헐렁해진다는 뜻이에요</text>
