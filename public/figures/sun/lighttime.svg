<text x="78.9888" y="96" text-anchor="start" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">13분</text>
<rect x="62" y="104" width="40.8" height="9" rx="2" fill="#ffc98a"/>
