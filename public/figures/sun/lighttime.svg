<text x="303.0" y="160" text-anchor="start" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">4시간 10분</text>
<line x1="62" y1="36" x2="62" y2="164" stroke="#4d6ea8" stroke-width="1"/>
