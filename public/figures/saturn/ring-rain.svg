<text x="250" y="58" text-anchor="middle" fill="#8fd8e0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">자기장 줄을 타고</text>
<text x="250" y="182" text-anchor="middle" fill="#8fd8e0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">중위도로 쏟아집니다</text>
<text x="170" y="200" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">카시니가 마지막 다섯 달에 고리와 토성 사이를 스물두 번 지나며 쟀어요</text>
<text x="170" y="214" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">이 속도라면 1억 년에서 3억 년 뒤에 고리가 사라질 것으로 봅니다</text>
<text x="170" y="228" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">화살표의 수와 굵기는 뜻을 보이려고 그린 것이고 실제 양이 아닙니다</text>
</svg>
