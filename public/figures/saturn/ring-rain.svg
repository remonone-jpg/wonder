<path d="M 226 113 Q 154 60 83 91" fill="none" stroke="#8fd8e0" stroke-width="1.3" marker-end="url(#ar4)"/>
<path d="M 226 119 Q 154 172 83 141" fill="none" stroke="#8fd8e0" stroke-width="1.3" marker-end="url(#ar4)"/>
