<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 238" width="660" role="img" aria-label="왼쪽에 토성이 있고 오른쪽으로 고리가 뻗어 있다. 고리의 여러 자리에서 위아래로 크게 휜 화살표가 행성의 중위도로 이어진다.">
<rect width="340" height="238" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">고리가 조금씩 토성으로 떨어집니다</text>
<circle cx="62" cy="116" r="32" fill="#c8a870" stroke="#e6d2a8" stroke-width="0.8"/>
