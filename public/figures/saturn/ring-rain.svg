<rect x="202" y="113" width="112" height="6" fill="#cfe0f5" opacity="0.9"/>
<text x="300" y="138" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="10" font-weight="600">고리</text>
<defs><marker id="ar4" viewBox="0 0 6 6" refX="4" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#8fd8e0"/></marker></defs>
