<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 226" width="660" height="443" role="img">
  <rect width="340" height="226" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">밖에 나가려면 기압이 있어야 합니다</text>

  <line x1="36" y1="140" x2="308" y2="140" stroke="#4a5a78" stroke-width="1"/>

  <rect x="56" y="100" width="46" height="40" fill="#6b93d6"/>
  <text x="79" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b93d6">지구</text>
  <text x="79" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">1기압</text>

  <rect x="148" y="80" width="46" height="60" fill="#e8b46a"/>
  <text x="171" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e8b46a">타이탄</text>
  <text x="171" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">1.5기압</text>

  <rect x="240" y="139.8" width="46" height="0.24" fill="#d08878"/>
  <text x="263" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#d08878">화성</text>
  <text x="263" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">0.006기압</text>

  <text x="170" y="188" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">타이탄은 압력복 없이 방한복과 산소마스크면 됩니다</text>
  <text x="170" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">다만 영하 179도라 견딜 재료가 아직 마땅치 않아요</text>
  <text x="170" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6e829e">막대 높이는 기압의 실제 비율입니다</text>
</svg>
