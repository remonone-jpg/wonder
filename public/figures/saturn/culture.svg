<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" width="660" height="419" role="img">
  <rect width="340" height="214" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">한평생에 두세 바퀴</text>

  <rect x="36" y="94" width="268" height="24" fill="#2a3352"/>
  <line x1="135" y1="88" x2="135" y2="124" stroke="#dec284" stroke-width="2"/>
  <line x1="234" y1="88" x2="234" y2="124" stroke="#dec284" stroke-width="2"/>

  <text x="86" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#dec284">한 바퀴</text>
  <text x="185" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#dec284">두 바퀴</text>
  <text x="269" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#dec284">세 바퀴째</text>

  <text x="36" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">태어난 날</text>
  <text x="304" y="146" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">여든 살</text>

  <text x="170" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">토성이 하늘을 한 바퀴 도는 데 29년</text>

  <text x="170" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">별자리 하나에 2년 반씩 머뭅니다</text>
  <text x="170" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">맨눈으로 보이는 다섯 행성 가운데 가장 느려요</text>
</svg>
