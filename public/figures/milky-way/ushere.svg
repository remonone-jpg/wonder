  <circle cx="210" cy="108" r="4" fill="#ffd54a"/>

  <text x="210" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#ffd54a">태양</text>
  <text x="190" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e4ebf6">2만 6천 광년</text>
