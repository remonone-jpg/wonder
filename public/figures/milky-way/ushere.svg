  <rect width="340" height="226" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">태양은 가운데가 아닙니다</text>

  <circle cx="170" cy="108" r="76" fill="#2a3352"/>
  <circle cx="170" cy="108" r="20" fill="#4a5578"/>
  <circle cx="170" cy="108" r="4" fill="#1a1f2e"/>

