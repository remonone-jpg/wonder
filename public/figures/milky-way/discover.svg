<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 204" width="660" role="img" aria-label="가운데 보이지 않는 점을 길쭉한 타원으로 도는 별의 궤도를 그린 그림.">
<rect width="340" height="204" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">보이지 않는 것의 무게를 재는 법</text>
<ellipse cx="150" cy="106" rx="78" ry="42" fill="none" stroke="#9ad0ff" stroke-width="1.2" stroke-dasharray="5 4"/>
<circle cx="84.3" cy="106" r="5" fill="none" stroke="#ffd27f" stroke-width="1.4"/>
<circle cx="84.3" cy="106" r="1.6" fill="#ffd27f"/>
<text x="84.27329309938007" y="54" text-anchor="middle" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="400">여기 아무것도 안 보임</text>
<circle cx="195.8" cy="140.0" r="3.4" fill="#fff3dd"/>
<circle cx="72.0" cy="106.0" r="2.6" fill="#fff3dd"/>
<circle cx="195.8" cy="72.0" r="3.4" fill="#fff3dd"/>
<circle cx="150.0" cy="148.0" r="2.4" fill="#fff3dd"/>
<text x="222" y="164" text-anchor="end" fill="#d3e0f3" font-family="system-ui, sans-serif" font-size="9" font-weight="400">별 하나</text>
<text x="170" y="174" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">한 바퀴 도는 데 16년. 그 빠르기로 돌려면</text>
<text x="170" y="190" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">가운데에 태양 400만 개만큼이 있어야 합니다</text>
</svg>
