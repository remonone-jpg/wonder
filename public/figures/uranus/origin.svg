    </marker>
  </defs>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">지금 자리에서 태어나지 않았습니다</text>

  <circle cx="28" cy="110" r="7" fill="#ffb84d"/>
  <text x="28" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffe3a8">태양</text>

  <rect x="42" y="100" width="96" height="20" fill="#3a4560"/>
  <text x="90" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#cfd8e8">재료가 빽빽한 곳</text>
  <rect x="142" y="104" width="170" height="12" fill="#232b40"/>
