<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="660" height="427" role="img">
  <rect width="340" height="220" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">자석이 기울고 치우쳐 있습니다</text>

  <circle cx="104" cy="122" r="58" fill="#a8d8e8"/>

  <line x1="104" y1="44" x2="104" y2="200" stroke="#2b4a56" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="104" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5f8fa0">자전축</text>

  <line x1="36" y1="157" x2="172" y2="87" stroke="#1d3a6b" stroke-width="2.4"/>
  <text x="182" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#1d3a6b">자기축</text>

  <path d="M104,62 A60,60 0 0 0 73,70" fill="none" stroke="#e2725b" stroke-width="1.8"/>
  <text x="72" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#e2725b">59도</text>

  <line x1="98" y1="122" x2="110" y2="122" stroke="#2b4a56" stroke-width="1.4"/>
  <line x1="104" y1="116" x2="104" y2="128" stroke="#2b4a56" stroke-width="1.4"/>
  <circle cx="123" cy="112" r="4.5" fill="#1d3a6b"/>
  <line x1="127" y1="110" x2="186" y2="110" stroke="#5b6a8a" stroke-width="1"/>
  <text x="192" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#9dbbe4">자기장의 중심</text>
  <text x="192" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">한가운데서 반지름의</text>
  <text x="192" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">3분의 1만큼 벗어남</text>

