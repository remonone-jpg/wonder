  <text x="170" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">자전축이 97.8도 기울어 거의 누워 있습니다</text>
  <text x="170" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">축은 우주에서 늘 같은 쪽을 가리킵니다 · 궤도는 그리기 쉽게 눕혀 그린 것</text>
