<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="660" height="447" role="img">
  <rect width="340" height="230" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">누운 채로 태양을 돕니다</text>

  <circle cx="170" cy="118" r="10" fill="#ffb84d"/>
  <text x="170" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffe3a8">태양</text>
  <ellipse cx="170" cy="118" rx="126" ry="62" fill="none" stroke="#3a4560" stroke-width="1.2" stroke-dasharray="4 4"/>

  <g>
    <circle cx="44" cy="118" r="20" fill="#a8d8e8"/>
    <line x1="44" y1="92" x2="44" y2="144" stroke="#1d3a6b" stroke-width="2"/>
    <text x="44" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9dbbe4">북극이 낮</text>
    <text x="44" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">42년</text>
  </g>

  <g>
    <circle cx="296" cy="118" r="20" fill="#a8d8e8"/>
    <line x1="296" y1="92" x2="296" y2="144" stroke="#1d3a6b" stroke-width="2"/>
    <text x="296" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9dbbe4">남극이 낮</text>
    <text x="296" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">42년</text>
  </g>

  <g>
