<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="660" role="img" aria-label="회색 원 다섯이 나란히 놓여 있다. 맨 왼쪽이 아주 작고 오른쪽으로 갈수록 커지다 가운데 오른쪽 것이 가장 크다. 각 원 아래에 이름과 지름이 적혀 있다.">
<rect width="340" height="210" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">이름은 희곡과 시에서 왔습니다</text>
<circle cx="34" cy="92" r="6.6" fill="#9aa3ad" stroke="#cfd8e3" stroke-width="0.6"/>
<circle cx="32.0" cy="90.0" r="3.3" fill="#bcc4ce" opacity="0.45"/>
<circle cx="96" cy="92" r="16.1" fill="#9aa3ad" stroke="#cfd8e3" stroke-width="0.6"/>
<circle cx="91.2" cy="87.2" r="8.1" fill="#bcc4ce" opacity="0.45"/>
<circle cx="164" cy="92" r="16.3" fill="#9aa3ad" stroke="#cfd8e3" stroke-width="0.6"/>
<circle cx="159.1" cy="87.1" r="8.1" fill="#bcc4ce" opacity="0.45"/>
<circle cx="240" cy="92" r="22.0" fill="#9aa3ad" stroke="#cfd8e3" stroke-width="0.6"/>
<circle cx="233.4" cy="85.4" r="11.0" fill="#bcc4ce" opacity="0.45"/>
<circle cx="306" cy="92" r="21.2" fill="#9aa3ad" stroke="#cfd8e3" stroke-width="0.6"/>
<circle cx="299.6" cy="85.6" r="10.6" fill="#bcc4ce" opacity="0.45"/>
<text x="34" y="132.0" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">미란다</text>
<text x="34" y="144.0" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">471km</text>
<text x="96" y="132.0" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">아리엘</text>
<text x="96" y="144.0" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">1,158km</text>
<text x="164" y="132.0" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">움브리엘</text>
<text x="164" y="144.0" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">1,169km</text>
<text x="240" y="132.0" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">티타니아</text>
<text x="240" y="144.0" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">1,578km</text>
<text x="306" y="132.0" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">오베론</text>
<text x="306" y="144.0" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">1,522km</text>
<text x="170" y="164.0" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">안쪽에서 바깥 순서로 늘어놓았고 지름은 실제 비율입니다</text>
<text x="170" y="178.0" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">미란다와 티타니아와 오베론은 셰익스피어의 희곡에서,</text>
<text x="170" y="192.0" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">아리엘과 움브리엘은 포프의 시에서 이름을 받았어요</text>
</svg>
