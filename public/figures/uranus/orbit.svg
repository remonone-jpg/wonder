<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="660" height="388" role="img">
  <rect width="340" height="200" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">발견한 뒤 아직 세 바퀴를 못 돌았습니다</text>

  <line x1="24" y1="66" x2="316" y2="66" stroke="#3a4560" stroke-width="10"/>
  <line x1="24" y1="66" x2="269" y2="66" stroke="#a8d8e8" stroke-width="10"/>

  <line x1="24" y1="54" x2="24" y2="78" stroke="#cfd8e8" stroke-width="1.4"/>
  <text x="24" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cfd8e8">1781</text>
  <text x="24" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">발견</text>

  <line x1="122" y1="54" x2="122" y2="78" stroke="#8fa6c8" stroke-width="1.2"/>
  <text x="122" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">1865</text>
  <text x="122" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">한 바퀴</text>

  <line x1="220" y1="54" x2="220" y2="78" stroke="#8fa6c8" stroke-width="1.2"/>
  <text x="220" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">1949</text>
  <text x="220" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">두 바퀴</text>

  <line x1="316" y1="54" x2="316" y2="78" stroke="#efd9a6" stroke-width="1.4"/>
  <text x="316" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#efd9a6">2033</text>
  <text x="316" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c7a86a">세 바퀴</text>

  <circle cx="269" cy="66" r="5" fill="#ffffff"/>
  <text x="269" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff">지금</text>

  <text x="170" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">태양을 한 바퀴 도는 데 84년이 걸립니다</text>
  <text x="170" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">발견한 사람도, 그다음 여러 세대도</text>
  <text x="170" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">제자리로 돌아오는 것을 못 보고 떠났습니다</text>
</svg>
