<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="660" height="388" role="img">
  <rect width="340" height="200" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">해가 42년 동안 뜨지 않습니다</text>

  <text x="96" y="66" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#9dbbe4">지구의 북극</text>
  <rect x="104" y="54" width="104" height="16" fill="#ffd27a"/>
  <rect x="208" y="54" width="104" height="16" fill="#243050"/>
  <text x="156" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a3a16">낮 6개월</text>
  <text x="260" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9dbbe4">밤 6개월</text>

  <text x="96" y="110" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#a8d8e8">천왕성의 극</text>
  <rect x="104" y="98" width="104" height="16" fill="#ffd27a"/>
  <rect x="208" y="98" width="104" height="16" fill="#243050"/>
  <text x="156" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a3a16">낮 42년</text>
  <text x="260" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9dbbe4">밤 42년</text>

  <text x="170" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">한 번의 밤이 사람 한평생의 절반입니다</text>
  <text x="170" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">햇빛도 지구의 370분의 1밖에 안 됩니다</text>
  <text x="170" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">막대는 낮과 밤의 길이를 견준 것이고 시간 축척이 아닙니다</text>
</svg>
