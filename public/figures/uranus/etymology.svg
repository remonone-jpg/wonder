<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="660" height="408" role="img">
  <rect width="340" height="210" fill="#0c1020"/>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">이름이 정해지는 데 69년</text>

  <line x1="40" y1="76" x2="40" y2="160" stroke="#5b6a8a" stroke-width="1.2"/>
  <circle cx="40" cy="76" r="4" fill="#a8d8e8"/>
  <text x="54" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#a8d8e8">1781 · 허셜이 찾음</text>

  <circle cx="40" cy="110" r="4" fill="#efd9a6"/>
  <text x="54" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">1781 · 조지의 별</text>
  <text x="54" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">영국 왕의 이름 · 영국 밖에서는 안 씀</text>

  <circle cx="40" cy="146" r="4" fill="#efd9a6"/>
  <text x="54" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">1782 · 보데가 우라노스 제안</text>
  <text x="54" y="156" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">목성의 아버지가 토성, 그 아버지가 우라노스</text>

  <circle cx="40" cy="178" r="4" fill="#ffffff"/>
  <text x="54" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">1850 · 영국도 우라노스로 바꿈</text>
  <text x="54" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#8fa6c8">발견하고 69년 뒤</text>
  <line x1="40" y1="160" x2="40" y2="178" stroke="#5b6a8a" stroke-width="1.2"/>
</svg>
