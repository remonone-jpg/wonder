<text x="27" y="80" text-anchor="start" fill="#9fb8d8" font-family="system-ui, sans-serif" font-size="9" font-weight="400">뜨거운 맨틀 — 물·암모니아·메탄</text>
<text x="27" y="197" text-anchor="start" fill="#e8d3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="400">돌 핵</text>
