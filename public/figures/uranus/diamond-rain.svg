<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 252" width="660" role="img" aria-label="가로로 세 층을 나눈 단면. 위는 옅은 대기, 가운데는 짙은 파란 맨틀, 아래는 갈색 핵이다. 맨틀 왼쪽에서 메탄 동그라미가 화살표를 지나 마름모로 바뀌고, 오른쪽에서는 마름모들이 아래를 가리키는 화살표와 함께 흩어져 있다.">
