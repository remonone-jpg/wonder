<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 176" width="660" height="342" role="img"
     aria-label="화성의 북쪽에서 남쪽까지 높낮이를 그린 단면. 북반구는 낮고 평평하며 남반구는 높고, 남반구 안에 헬라스 분지가 깊게 파여 있다.">
  <rect width="340" height="176" fill="#0b1018"/>

  <text x="16" y="22" fill="#ffe0b8" font-family="sans-serif" font-size="13" font-weight="600">화성의 높낮이 — 북쪽에서 남쪽으로</text>

  <!-- 높이 눈금. 0km 는 화성의 기준면이다. -->
  <g stroke="#3d4a60" stroke-width="0.7" font-family="sans-serif" font-size="9" fill="#9db0cb">
    <line x1="38" y1="52" x2="326" y2="52" stroke-dasharray="3 3"/>
    <text x="10" y="55">+4km</text>
    <line x1="38" y1="84" x2="326" y2="84"/>
    <text x="14" y="87">0km</text>
    <line x1="38" y1="140" x2="326" y2="140" stroke-dasharray="3 3"/>
    <text x="10" y="143">−7km</text>
  </g>

  <!-- 단면. 왼쪽이 북극, 오른쪽이 남극. -->
  <path d="M38 108 L120 106 L150 104 L170 96 L186 70 L214 66 L226 68
           L238 128 L250 140 L272 140 L286 126 L296 68 L318 64 L326 66
           L326 176 L38 176 Z"
        fill="#7a3b24" stroke="#d99a6c" stroke-width="1.4"/>

  <!-- 라벨 -->
  <g font-family="sans-serif" font-size="10" fill="#f0f4fb">
    <text x="52" y="126">북반구 저지</text>
    <text x="196" y="56">남반구 고지</text>
    <text x="228" y="160">헬라스 분지</text>
  </g>
  <g stroke="#ffd9a8" stroke-width="0.8" fill="none">
    <line x1="262" y1="152" x2="262" y2="142"/>
  </g>

  <text x="16" y="170" fill="#9db0cb" font-family="sans-serif" font-size="9.5">높낮이는 알아보기 쉽도록 부풀려 그렸어요.</text>
</svg>
