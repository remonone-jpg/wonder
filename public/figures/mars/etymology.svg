  <circle cx="44" cy="112" r="16" fill="#c4543a"/>
  <text x="44" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d08878">붉은 점 하나</text>

  <line x1="62" y1="104" x2="92" y2="62" stroke="#8fa6c8" stroke-width="1"/>
