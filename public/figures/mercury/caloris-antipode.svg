<circle cx="170" cy="110" r="58" fill="#2a2520" stroke="#6b5f52" stroke-width="1.2"/>
<circle cx="170" cy="110" r="49.3" fill="#3d3128" stroke="#8a7460" stroke-width="0.8"/>
