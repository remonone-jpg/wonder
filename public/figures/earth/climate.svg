<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="660" role="img" aria-label="위에서 내려온 노란 화살표가 점선 층을 그냥 통과해 땅에 닿고, 땅에서 올라간 붉은 화살표 가운데 일부만 점선을 통과해 나가고 나머지는 되돌아온다.">
<rect width="340" height="210" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">나가는 열만 붙잡힌다</text>
<defs><marker id="dn" viewBox="0 0 6 6" refX="4" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#ffd27f"/></marker><marker id="up" viewBox="0 0 6 6" refX="4" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#ff8a6b"/></marker><marker id="bk" viewBox="0 0 6 6" refX="4" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#ff8a6b"/></marker></defs>
<rect x="16" y="150" width="308" height="20" rx="3" fill="#4a3a2a"/>
<text x="170" y="164" text-anchor="middle" fill="#e0c8a8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">땅</text>
<line x1="16" y1="80" x2="324" y2="80" stroke="#7fd8c0" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="324" y="94" text-anchor="end" fill="#7fd8c0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">대기</text>
<path d="M 34 38 L 62 147" stroke="#ffd27f" stroke-width="1.6" marker-end="url(#dn)"/>
<path d="M 56 38 L 84 147" stroke="#ffd27f" stroke-width="1.6" marker-end="url(#dn)"/>
<text x="32" y="33" text-anchor="start" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="600">햇빛</text>
<text x="96" y="122" text-anchor="start" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="400">그냥 통과</text>
<path d="M 144 147 L 144 38" stroke="#ff8a6b" stroke-width="1.6" marker-end="url(#up)"/>
<path d="M 306 147 L 306 38" stroke="#ff8a6b" stroke-width="1.6" marker-end="url(#up)"/>
<text x="316" y="33" text-anchor="end" fill="#ff8a6b" font-family="system-ui, sans-serif" font-size="9" font-weight="400">일부만 나감</text>
<path d="M 196 147 L 196 83" stroke="#ff8a6b" stroke-width="1.4"/>
<path d="M 205 83 L 205 145" stroke="#ff8a6b" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#bk)"/>
<path d="M 236 147 L 236 83" stroke="#ff8a6b" stroke-width="1.4"/>
<path d="M 245 83 L 245 145" stroke="#ff8a6b" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#bk)"/>
<path d="M 276 147 L 276 83" stroke="#ff8a6b" stroke-width="1.4"/>
<path d="M 285 83 L 285 145" stroke="#ff8a6b" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#bk)"/>
<text x="240" y="73" text-anchor="middle" fill="#ff8a6b" font-family="system-ui, sans-serif" font-size="9" font-weight="400">붙잡혔다 되돌아옴</text>
<text x="170" y="186" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">되돌아오는 이 몫이 지표를 33도 데웁니다</text>
<text x="170" y="200" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">공기가 없다면 영하 18도, 실제로는 15도예요</text>
</svg>
