<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 262" width="660" role="img" aria-label="지구의 단면을 그린 동그라미. 맨 위 진원에서 나온 선들이 속을 휘어 가며 겉면에 닿는데, 아래쪽 넓은 구역에는 선이 하나도 닿지 않는다. 그 구역이 다른 색으로 칠해져 있다.">
