<text x="118" y="46" text-anchor="middle" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="400">지진이 난 자리</text>
<text x="118" y="190" text-anchor="middle" fill="#f0b0d0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">여기는</text>
<text x="118" y="202" text-anchor="middle" fill="#f0b0d0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">아무것도 안 와요</text>
<rect x="212" y="62" width="11" height="4" fill="#8fd8c0"/>
<text x="228" y="67" text-anchor="start" fill="#8fd8c0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">옆으로 흔드는 파</text>
<rect x="212" y="84" width="11" height="8" fill="#8a4a3a"/>
<text x="228" y="91" text-anchor="start" fill="#e0b0a0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">녹아 있는 바깥 핵</text>
<rect x="212" y="108" width="11" height="8" fill="#4a2c48"/>
<text x="228" y="115" text-anchor="start" fill="#f0b0d0" font-family="system-ui, sans-serif" font-size="9" font-weight="400">파가 닿지 않는 곳</text>
<text x="212" y="142" text-anchor="start" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">액체는 옆으로 밀면</text>
<text x="212" y="154" text-anchor="start" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">그냥 흘러 버려서</text>
<text x="212" y="166" text-anchor="start" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">이 파를 지나보내지</text>
<text x="212" y="178" text-anchor="start" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">못합니다</text>
<text x="170" y="238" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">지구 반대편 넓은 구역에 이 파가 아예 오지 않는다는 것이</text>
<text x="170" y="252" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">바깥 핵이 녹아 있다는 증거가 되었습니다</text>
