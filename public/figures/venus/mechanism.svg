    <path d="M62,-14 A62,62 0 0 0 -24,-58" fill="none" stroke="#efd9a6" stroke-width="3" marker-end="url(#l)"/>
  </g>
  <text x="470" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#efd9a6">금성은 반대로 돕니다</text>
