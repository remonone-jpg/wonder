<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img">
  <rect width="660" height="330" fill="#0c1020"/>
  <defs>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#efd9a6"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9dbbe4"/>
    </marker>
  </defs>

  <text x="30" y="72" font-family="system-ui, sans-serif" font-size="17" fill="#cfd8e8">제 몸 한 바퀴</text>
  <rect x="210" y="56" width="405" height="26" rx="4" fill="#e6c07a"/>
  <text x="392" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#4a3a16">243일</text>

  <text x="30" y="132" font-family="system-ui, sans-serif" font-size="17" fill="#cfd8e8">태양 한 바퀴</text>
  <rect x="210" y="116" width="375" height="26" rx="4" fill="#c79c5e"/>
  <text x="392" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#3b2e10">225일</text>

  <text x="330" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#efd9a6">하루가 한 해보다 깁니다</text>

  <g transform="translate(180,250)">
    <circle r="46" fill="#6b93d6"/>
    <text y="6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#0c1020">지구</text>
    <path d="M-62,-14 A62,62 0 0 1 24,-58" fill="none" stroke="#9dbbe4" stroke-width="3" marker-end="url(#r)"/>
  </g>
  <text x="180" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#9dbbe4">서쪽에서 해가 지고</text>

  <g transform="translate(470,250)">
    <circle r="46" fill="#e6c07a"/>
