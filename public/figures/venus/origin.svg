<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" width="660" height="408" role="img">
  <rect width="340" height="210" fill="#0c1020"/>
  <defs>
    <marker id="oe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9dbbe4"/>
    </marker>
  </defs>

  <text x="170" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cfd8e8">가벼운 것은 달아나고 무거운 것은 남습니다</text>

  <circle cx="70" cy="104" r="38" fill="#e6c07a"/>
  <circle cx="56" cy="92" r="6" fill="#5c4a22"/>
  <circle cx="84" cy="96" r="6" fill="#5c4a22"/>
  <circle cx="60" cy="118" r="6" fill="#5c4a22"/>
  <circle cx="86" cy="122" r="6" fill="#5c4a22"/>
  <text x="70" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">금성</text>

  <g stroke="#9dbbe4" stroke-width="2.2" marker-end="url(#oe)">
    <line x1="114" y1="88" x2="152" y2="88"/>
    <line x1="114" y1="104" x2="152" y2="104"/>
    <line x1="114" y1="120" x2="152" y2="120"/>
  </g>
  <text x="160" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#9dbbe4">가벼운 수소는 달아나요</text>

  <text x="170" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">무거운 수소는 남아서 비율이 올라갑니다</text>
  <text x="170" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8fa6c8">지금 금성 물에서는 지구의 백 배쯤 됩니다</text>
</svg>
