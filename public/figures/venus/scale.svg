<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="660" height="349" role="img">
  <rect width="340" height="180" fill="#0c1020"/>

  <text x="170" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">지구에서 재어 본 거리</text>

  <text x="104" y="65" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#efd9a6">금성, 가까울 때</text>
  <rect x="112" y="54" width="32" height="14" fill="#e6c07a"/>
  <text x="152" y="65" font-family="system-ui, sans-serif" font-size="11" fill="#cfd8e8">4,100만 km</text>

  <text x="104" y="97" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#d98f6a">화성, 가까울 때</text>
  <rect x="112" y="86" width="43" height="14" fill="#c1440e"/>
  <text x="163" y="97" font-family="system-ui, sans-serif" font-size="11" fill="#cfd8e8">5,600만 km</text>

