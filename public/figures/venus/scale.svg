  <text x="212" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f4e6c6">2억 6,000만 km</text>

  <text x="170" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8fa6c8">막대 길이는 실제 비율이에요</text>
