<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="660" height="388" role="img">
  <rect width="340" height="200" fill="#0c1020"/>
  <defs>
    <marker id="vu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#efd9a6"/>
    </marker>
  </defs>

  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#cfd8e8">이산화탄소가 돌아갈 길</text>

  <line x1="170" y1="40" x2="170" y2="160" stroke="#2a3350" stroke-width="1.2"/>

  <text x="86" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#9dbbe4">지구</text>
  <circle cx="86" cy="108" r="32" fill="none" stroke="#6b93d6" stroke-width="2.2"/>
  <g fill="#6b93d6">
    <path d="M82,74 L92,78 L82,82 Z"/>
    <path d="M114,104 L118,114 L110,114 Z"/>
    <path d="M90,142 L80,138 L90,134 Z"/>
    <path d="M58,112 L54,102 L62,102 Z"/>
  </g>
  <text x="86" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9dbbe4">돌고 돕니다</text>
  <text x="86" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#cfd8e8">돌아갈 길이 있어요</text>

  <text x="256" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#efd9a6">금성</text>
  <rect x="196" y="72" width="120" height="22" fill="#e6c07a"/>
  <text x="256" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a3a16">공기</text>
  <rect x="196" y="128" width="120" height="22" fill="#3a2a12"/>
  <text x="256" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e6c07a">땅</text>

  <line x1="222" y1="128" x2="222" y2="100" stroke="#efd9a6" stroke-width="3" marker-end="url(#vu)"/>
  <line x1="290" y1="96" x2="290" y2="128" stroke="#7a6a4a" stroke-width="2" stroke-dasharray="4 3"/>
  <g stroke="#e2725b" stroke-width="3" stroke-linecap="round">
    <line x1="283" y1="105" x2="297" y2="119"/>
    <line x1="297" y1="105" x2="283" y2="119"/>
  </g>
  <text x="256" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#e2725b">돌아갈 길이 없어요</text>

  <text x="170" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8fa6c8">지구는 돌려보내고 금성은 쌓아 두기만 합니다</text>
</svg>
