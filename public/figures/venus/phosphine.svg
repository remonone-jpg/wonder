<text x="66" y="82" text-anchor="end" fill="#8fd8b0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">찾았다는 쪽</text>
<text x="181.0" y="124" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">이 파임이 포스핀의 자국이다</text>
<path d="M 74.0 156.9 L 78.9 156.0 L 83.7 155.6 L 88.6 155.5 L 93.5 155.7 L 98.3 155.7 L 103.2 155.5 L 108.0 154.9 L 112.9 154.3 L 117.8 153.8 L 122.6 153.9 L 127.5 154.6 L 132.4 155.9 L 137.2 157.4 L 142.1 158.8 L 147.0 159.5 L 151.8 159.3 L 156.7 158.3 L 161.5 156.7 L 166.4 155.2 L 171.3 154.0 L 176.1 153.5 L 181.0 153.7 L 185.9 154.3 L 190.7 155.1 L 195.6 155.7 L 200.5 156.0 L 205.3 156.0 L 210.2 155.9 L 215.0 156.0 L 219.9 156.4 L 224.8 157.2 L 229.6 158.0 L 234.5 158.5 L 239.4 158.5 L 244.2 157.7 L 249.1 156.3 L 254.0 154.7 L 258.8 153.3 L 263.7 152.6 L 268.5 152.7 L 273.4 153.7 L 278.3 155.1 L 283.1 156.6 L 288.0 157.7" fill="none" stroke="#e0a0a0" stroke-width="1.8"/>
<text x="66" y="160" text-anchor="end" fill="#e0a0a0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">아니라는 쪽</text>
<text x="181.0" y="202" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">다듬는 방법을 바꾸면 파임이 사라진다</text>
<line x1="181.0" y1="60" x2="181.0" y2="168" stroke="#4d6ea8" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="181.0" y="54" text-anchor="middle" fill="#9fb8d8" font-family="system-ui, sans-serif" font-size="9" font-weight="400">포스핀이 빛을 삼킨다는 자리</text>
<text x="170" y="220" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">관측 자료는 하나인데 읽는 방법이 달라 답이 갈렸어요</text>
<text x="170" y="234" text-anchor="middle" fill="#8fa3bf" font-family="system-ui, sans-serif" font-size="8" font-weight="400">선의 모양은 다툼의 뜻을 보이려고 그린 것이고 실제 관측값이 아닙니다</text>
</svg>
