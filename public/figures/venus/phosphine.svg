<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 244" width="660" role="img" aria-label="위아래로 두 칸이 있다. 위 칸의 울퉁불퉁한 선은 가운데가 아래로 파여 있고, 아래 칸의 선은 비슷하게 울퉁불퉁하지만 파인 곳이 없다.">
<rect width="340" height="244" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">같은 자리를 두 쪽이 다르게 읽습니다</text>
