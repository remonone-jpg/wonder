<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 206" width="660" role="img" aria-label="가운데 태양을 두고 혜성이 네 자리에 그려져 있고 꼬리가 모두 태양 반대쪽으로 뻗어 있다.">
<rect width="340" height="206" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">꼬리는 늘 태양의 반대쪽</text>
<ellipse cx="192" cy="112" rx="118" ry="48" fill="none" stroke="#4d6ea8" stroke-width="1" stroke-dasharray="4 4"/>
