<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 226" width="660" role="img" aria-label="가운데 점을 둘러싼 원 두 개. 바깥 원의 반지름이 안쪽 원의 세 배 남짓이다.">
<rect width="340" height="226" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">빛이 달려온 시간과 지금의 거리</text>
<circle cx="170" cy="120" r="134.8" fill="#16233d" stroke="#7fb4ff" stroke-width="1.3"/>
<circle cx="170" cy="120" r="40.0" fill="#2a3a63" stroke="#ffd27f" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="170" cy="120" r="2.6" fill="#fff3dd"/>
<path d="M 170 120 L 210.0 120" stroke="#ffd27f" stroke-width="1.2"/>
<path d="M 170 112 L 304.8 112" stroke="#7fb4ff" stroke-width="1.2"/>
<text x="190.0" y="134" text-anchor="middle" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="400">138억 광년</text>
<text x="251.3913043478261" y="106" text-anchor="middle" fill="#9ad0ff" font-family="system-ui, sans-serif" font-size="9" font-weight="400">465억 광년</text>
<text x="170" y="38" text-anchor="middle" fill="#9ad0ff" font-family="system-ui, sans-serif" font-size="9" font-weight="400">바깥 원 — 지금 그 자리까지의 거리</text>
<text x="170" y="270.7826086956522" text-anchor="middle" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="9" font-weight="400">안쪽 원 — 빛이 달려온 시간을 거리로 바꾼 것</text>
<text x="170" y="216" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">우리가 볼 수 있는 가장 바깥이 바깥쪽 원입니다</text>
