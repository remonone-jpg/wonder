<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 198" width="660" role="img" aria-label="왼쪽에 해와 그 둘레를 도는 지구 궤도, 오른쪽 멀리 목성과 위성이 있고 두 자리에서 목성까지의 길이가 다르게 표시된 그림.">
<rect width="340" height="198" fill="#0b1220"/>
<text x="170" y="20" text-anchor="middle" fill="#ffe0b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">지구가 멀어지면 빛이 늦게 온다</text>
<ellipse cx="74" cy="92" rx="40" ry="24" fill="none" stroke="#4d6ea8" stroke-width="1" stroke-dasharray="4 4"/>
<circle cx="74" cy="92" r="9" fill="#ffd27f"/>
<text x="74" y="125" text-anchor="middle" fill="#ffe0a8" font-family="system-ui, sans-serif" font-size="9" font-weight="400">해</text>
<circle cx="286" cy="92" r="13" fill="#d8a56a"/>
<circle cx="264" cy="92" r="3.4" fill="#e8f6ff"/>
<text x="286" y="124" text-anchor="middle" fill="#ffd8ae" font-family="system-ui, sans-serif" font-size="9" font-weight="400">목성</text>
<text x="262" y="107" text-anchor="end" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="8" font-weight="400">위성</text>
<circle cx="114" cy="92" r="4.6" fill="#7fb4ff"/>
<circle cx="34" cy="92" r="4.6" fill="#7fb4ff"/>
<path d="M 121 78 L 269 78" stroke="#9ad0ff" stroke-width="1.3"/>
<path d="M 41 114 L 269 114" stroke="#ffd27f" stroke-width="1.3"/>
<text x="200.0" y="72" text-anchor="middle" fill="#9ad0ff" font-family="system-ui, sans-serif" font-size="8" font-weight="400">가까울 때</text>
<text x="180" y="126" text-anchor="middle" fill="#ffd27f" font-family="system-ui, sans-serif" font-size="8" font-weight="400">멀 때 — 지구 궤도의 지름만큼 더 멀다</text>
<text x="170" y="160" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">두 줄의 길이 차이가 곧 지구 궤도의 지름입니다</text>
<text x="170" y="174" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">뢰머는 그 차이만큼 위성의 식이 늦어지는 것을 보고</text>
<text x="170" y="188" text-anchor="middle" fill="#cfe0f5" font-family="system-ui, sans-serif" font-size="9" font-weight="400">빛이 그 길을 건너는 데 22분쯤 걸린다고 적었어요</text>
</svg>
